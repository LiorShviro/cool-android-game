name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Inject version into UI
        run: |
          sed -i 's/Build: 1.0 (Local)/Build: 1.0.${{ github.run_number }}/g' App.tsx

      - name: Build Android APK
        run: |
          cd android
          # Set version based on GitHub Run Number
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName="1.0.${{ github.run_number }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MamadManager-v1.0.${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
