name: Mamad Standalone Build

on:
  push:
    branches: [ main, public ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName="1.0.${{ github.run_number }}" -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MamadManager-v1.0.${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: cd web && npm install

      - name: Build web app
        run: cd web && npm run build

      - name: Prepare game folder
        run: |
          mkdir -p _game
          cp -r web/dist/* _game/

      - name: Deploy game to docs/play
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _game
          target-folder: docs/play
          branch: public
